name: AgentSolis AI review sync

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Sync confirmed disputes and advance eligible AI rulings
        env:
          AI_REVIEW_SYNC_URL: ${{ secrets.AI_REVIEW_SYNC_URL }}
          AI_REVIEW_TRIGGER_TOKEN: ${{ secrets.AI_REVIEW_TRIGGER_TOKEN }}
        run: |
          if [ -z "$AI_REVIEW_SYNC_URL" ] || [ -z "$AI_REVIEW_TRIGGER_TOKEN" ]; then
            echo "AI review sync is not configured; leaving the production gate closed."
            exit 0
          fi
          readiness_url="${AI_REVIEW_SYNC_URL%/sync}/readiness"
          readiness="$(curl --fail --silent --show-error --max-time 30 \
            -H "Authorization: Bearer $AI_REVIEW_TRIGGER_TOKEN" "$readiness_url")"
          READINESS="$readiness" python - <<'PY'
          import json, os, sys
          status = json.loads(os.environ["READINESS"])
          if not status.get("evaluation_ready"):
              print("AI review providers are not ready; sync was not started.")
              sys.exit(1)
          print("AI review provider readiness passed.")
          PY
          curl --fail --silent --show-error --max-time 150 \
            -X POST -H "Authorization: Bearer $AI_REVIEW_TRIGGER_TOKEN" \
            "$AI_REVIEW_SYNC_URL"
